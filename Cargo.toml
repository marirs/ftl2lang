[package]
name = "ftl2lang"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Translate Fluent (.ftl) localization files between languages"
repository = "https://github.com/marirs/ftl2lang"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
dirs = "5"
fluent-syntax = "0.11"
futures = "0.3"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
toml = "0.8"
walkdir = "2"
whatlang = "0.16"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
